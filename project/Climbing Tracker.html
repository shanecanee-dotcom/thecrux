<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRUX — Climbing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #E9E9E9; font-family: 'DM Sans', sans-serif; overflow: hidden; }
  #root { height: 100%; width: 100%; }
  input, textarea, select, button { font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 0; display: none; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen-pad { padding: 20px; }

  /* number inputs */
  .num-in { width: 64px; text-align: center; font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; border-radius: 8px; padding: 8px 4px; outline: none; -moz-appearance: textfield; }
  .num-in::-webkit-outer-spin-button, .num-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .icon-btn { border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .round-btn { border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  /* Bottom-sheet modals — full-width on mobile, centered card on desktop */
  .sheet-wrap { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }
  .sheet { width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; max-height: 92vh; overflow-y: auto; animation: sheetUp 0.28s cubic-bezier(0.22,1,0.36,1); }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (min-width: 720px) {
    .sheet-wrap { align-items: center; }
    .sheet { max-width: 460px; border-radius: 20px; max-height: 88vh; animation: sheetPop 0.2s ease; }
    @keyframes sheetPop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="crux-data.jsx"></script>
<script type="text/babel" src="crux-ui.jsx"></script>
<script type="text/babel" src="crux-screens.jsx"></script>
<script type="text/babel" src="crux-profile.jsx"></script>
<script type="text/babel" src="crux-app.jsx"></script>
</body>
</html>
