<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #E9E9E9; font-family: 'DM Sans', sans-serif; }
  #root { height: 100%; width: 100%; }
  input, textarea, select, button { font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 0; display: none; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen-pad { padding: 20px; }

  /* number inputs */
  .num-in { width: 64px; text-align: center; font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; border-radius: 8px; padding: 8px 4px; outline: none; -moz-appearance: textfield; }
  .num-in::-webkit-outer-spin-button, .num-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .icon-btn { border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .round-btn { border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  /* Bottom-sheet modals — full-width on mobile, centered card on desktop */
  .sheet-wrap { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }
  .sheet { width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; max-height: 92vh; overflow-y: auto; animation: sheetUp 0.28s cubic-bezier(0.22,1,0.36,1); }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (min-width: 720px) {
    .sheet-wrap { align-items: center; }
    .sheet { max-width: 460px; border-radius: 20px; max-height: 88vh; animation: sheetPop 0.2s ease; }
    @keyframes sheetPop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  }

  /* Auth animations */
  @keyframes auSpin { to { transform: rotate(360deg); } }
  .au-spin { animation: auSpin .7s linear infinite; }
  .au-card { animation: auIn .35s cubic-bezier(.22,1,.36,1); }
  @keyframes auIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
